name: Check Trip.com affiliate links

on:
  schedule:
    # 00:17 UTC = 09:17 JST every Monday
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: affiliate-link-monitor
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Check catalog photo integrity
        id: catalog-check
        continue-on-error: true
        run: node scripts/check-catalog-integrity.mjs --online

      - name: Check all Trip.com links
        id: link-check
        continue-on-error: true
        run: node scripts/check-affiliate-links.mjs

      - name: Open or update alert issue
        if: steps.link-check.outcome == 'failure' || steps.catalog-check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'URGENT: catalog or affiliate integrity check failed';
            const body = [
              'The weekly GROUP STAY JAPAN catalog/affiliate monitor found an error.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Please inspect the failed facility, photo source, or affiliate link immediately.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail workflow when catalog or links are unhealthy
        if: steps.link-check.outcome == 'failure' || steps.catalog-check.outcome == 'failure'
        run: exit 1
